name: Package preview DMG
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: package-preview-dmg
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.2.0-preview.1
    steps:
      - name: Verify and package the published universal app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads stage mounted
          gh release download "$RELEASE_TAG" --pattern '*.zip' --pattern SHA256SUMS.txt --dir downloads
          (cd downloads && shasum -a 256 -c SHA256SUMS.txt)
          ditto -x -k downloads/Alcove-0.2.0-universal-unsigned-preview.zip stage
          codesign --verify --deep --strict stage/Alcove.app
          lipo stage/Alcove.app/Contents/MacOS/Alcove -verify_arch arm64 x86_64
          ln -s /Applications stage/Applications
          cat > 'stage/READ ME FIRST.txt' <<'NOTE'
          Alcove 0.2 — Unsigned Preview
          Drag Alcove.app to Applications.
          macOS 14+, Apple Silicon or Intel. No developer tools needed.
          This app is ad hoc signed, not Developer ID signed or notarized.
          macOS Gatekeeper may warn or block it. Do not disable system security.
          Early testing build, not a stable or independently audited browser.
          Source, privacy details and limitations: https://github.com/SinfulSoul007/alcove
          NOTE
          dmg=Alcove-0.2.0-universal-unsigned-preview.dmg
          hdiutil create -volname 'Alcove Preview' -srcfolder stage -format UDZO "$dmg"
          hdiutil verify "$dmg"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$PWD/mounted"
          trap 'hdiutil detach "$PWD/mounted" || true' EXIT
          test -L mounted/Applications
          codesign --verify --deep --strict mounted/Alcove.app
          cmp stage/Alcove.app/Contents/MacOS/Alcove mounted/Alcove.app/Contents/MacOS/Alcove
          hdiutil detach "$PWD/mounted"
          trap - EXIT
          gh release upload "$RELEASE_TAG" "$dmg"
          shasum -a 256 "$dmg" >> downloads/SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" downloads/SHA256SUMS.txt --clobber
