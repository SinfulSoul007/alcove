name: Test and package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 105
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify release package selection
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/ReleasePackageChecks.py
      - name: Run checks and build both architectures
        run: ./scripts/package.sh
      - name: Verify universal ZIP and DMG
        run: ./scripts/verify-preview-package.sh
      - name: Keep installable preview artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Alcove-universal-unsigned-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Alcove-*-universal-unsigned-preview.zip
            dist/Alcove-*-universal-unsigned-preview.dmg
            dist/SHA256SUMS.txt
