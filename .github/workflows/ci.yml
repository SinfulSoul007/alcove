name: Test and package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run checks and build both architectures
        run: ./scripts/package.sh
      - name: Verify universal ZIP and DMG
        shell: bash
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' scripts/Info.plist)
          zip="dist/Alcove-$version-universal-unsigned-preview.zip"
          dmg="dist/Alcove-$version-universal-unsigned-preview.dmg"
          test -s "$zip"
          test -s "$dmg"
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)
          python3 scripts/verify-package.py "$zip"
          mkdir -p .build/ci-zip .build/ci-dmg
          ditto -x -k "$zip" .build/ci-zip
          codesign --verify --deep --strict .build/ci-zip/Alcove.app
          lipo .build/ci-zip/Alcove.app/Contents/MacOS/Alcove -verify_arch arm64 x86_64
          cmp scripts/Info.plist .build/ci-zip/Alcove.app/Contents/Info.plist
          hdiutil verify "$dmg"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$PWD/.build/ci-dmg"
          trap 'hdiutil detach "$PWD/.build/ci-dmg" || true' EXIT
          test -L .build/ci-dmg/Applications
          test "$(readlink .build/ci-dmg/Applications)" = /Applications
          test -s '.build/ci-dmg/READ ME FIRST.txt'
          codesign --verify --deep --strict .build/ci-dmg/Alcove.app
          lipo .build/ci-dmg/Alcove.app/Contents/MacOS/Alcove -verify_arch arm64 x86_64
          cmp .build/ci-zip/Alcove.app/Contents/MacOS/Alcove .build/ci-dmg/Alcove.app/Contents/MacOS/Alcove
          cmp scripts/Info.plist .build/ci-dmg/Alcove.app/Contents/Info.plist
          hdiutil detach "$PWD/.build/ci-dmg"
          trap - EXIT
      - name: Keep installable preview artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Alcove-universal-unsigned-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Alcove-*-universal-unsigned-preview.zip
            dist/Alcove-*-universal-unsigned-preview.dmg
            dist/SHA256SUMS.txt
