name: Build WebKit request-blocking probe with faster compiler settings

on:
  push:
    branches: [research/webkit-fast-probe]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      WEBKIT_REVISION: 26695efdefc6076049ec50713a2c4e54b90b4d47
    steps:
      - name: Check out the owned loopback fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify the Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          df -h "$RUNNER_TEMP"
          printf 'kernel void probe() {}\n' > "$RUNNER_TEMP/compile-probe.metal"
          if ! xcrun --sdk macosx metal -c "$RUNNER_TEMP/compile-probe.metal" -o "$RUNNER_TEMP/compile-probe.air"; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun --sdk macosx metal -c "$RUNNER_TEMP/compile-probe.metal" -o "$RUNNER_TEMP/compile-probe.air"
          fi
          df -h "$RUNNER_TEMP"

      - name: Check out pinned upstream WebKit
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/WebKit"
          git -C "$RUNNER_TEMP/WebKit" remote add origin https://github.com/WebKit/WebKit.git
          git -C "$RUNNER_TEMP/WebKit" fetch --depth=1 origin "$WEBKIT_REVISION"
          git -C "$RUNNER_TEMP/WebKit" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/WebKit" rev-parse HEAD)" = "$WEBKIT_REVISION"
          df -h "$RUNNER_TEMP"

      - name: Compile the macOS engine
        working-directory: ${{ runner.temp }}/WebKit
        shell: bash
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/diagnostics/webkit-before-send-cancellation.patch"
          git apply --check "$patch"
          git apply "$patch"
          git diff --check
          # The pinned wrapper drops the stored numeric zero for --force-optimization-level=O0.
          # Send the build settings directly to Xcode and keep the Cocoa extension configuration.
          log="$RUNNER_TEMP/alcove-webkit-build.log"
          # WebKit requires an explicit opt-in to unoptimized Release code for this probe.
          release_define=RELEASE_WITHOUT_OPTIMIZATIONS=1
          printf '#include <wtf/Compiler.h>\n' |
            xcrun clang -x c++ -std=c++20 -I Source/WTF -O0 -DNDEBUG -D"$release_define" -fsyntax-only -
          definitions='GCC_PREPROCESSOR_DEFINITIONS=$(inherited) '"$release_define"
          settings=(GCC_OPTIMIZATION_LEVEL=0 SWIFT_OPTIMIZATION_LEVEL=-Onone
                    GCC_GENERATE_DEBUGGING_SYMBOLS=NO COMPILER_INDEX_STORE_ENABLE=NO)
          Tools/Scripts/build-webkit --release --lto-mode=none --only='Everything up to WebKit' \
            "${settings[@]}" "$definitions" -showBuildTimingSummary 2>&1 |
            awk '/Build Timing Summary/ { timing = 1 }
              NR <= 80 || NR % 4000 == 0 || (timing && timing++ <= 40) || / (fatal error|error|warning):|BUILD (SUCCEEDED|FAILED)|No space left/ {
                print substr($0, 1, 700)
                fflush()
              }' | tee "$log"
          for entry in "${settings[@]}"; do
            setting="${entry%%=*}"
            value="${entry#*=}"
            if ! grep -Eq "^[[:space:]]+${setting}[[:space:]]*=[[:space:]]*${value}[[:space:]]*$" "$log"; then
              printf 'Xcode did not report %s=%s\n' "$setting" "$value" >&2
              exit 1
            fi
          done
          if ! grep -Eq "^[[:space:]]+GCC_PREPROCESSOR_DEFINITIONS[[:space:]]*=.*${release_define}" "$log"; then
            printf 'Xcode did not report the unoptimized Release opt-in\n' >&2
            exit 1
          fi
          framework=WebKitBuild/Release/WebKit.framework/WebKit
          test -s "$framework"
          file "$framework"
          xcrun lipo -archs "$framework"
          df -h "$RUNNER_TEMP"

      - name: Require before-send cancellation in the built framework
        shell: bash
        run: |
          set -euo pipefail
          product="$RUNNER_TEMP/WebKit/WebKitBuild/Release"
          scratch=$(mktemp -d "$RUNNER_TEMP/alcove-webkit-probe.XXXXXX")
          server=''
          cleanup() {
            if [[ -n "$server" ]]; then kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true; fi
            rm -rf "$scratch"
          }
          trap cleanup EXIT
          xcrun swiftc -parse-as-library diagnostics/webkit-extension-probe.swift -o "$scratch/probe"
          python3 diagnostics/webkit-probe-server.py "$scratch/port" > "$scratch/requests.log" 2>&1 &
          server=$!
          for attempt in {1..100}; do
            [[ ! -s "$scratch/port" ]] || break
            kill -0 "$server"
            sleep 0.1
          done
          test -s "$scratch/port"
          status=0
          ALCOVE_EXPECT_WEBKIT_ROOT="$product" DYLD_FRAMEWORK_PATH="$product" __XPC_DYLD_FRAMEWORK_PATH="$product" \
            "$scratch/probe" "http://127.0.0.1:$(cat "$scratch/port")/" --require-blocking || status=$?
          cat "$scratch/requests.log"
          exit "$status"
