name: Build and test WebKit runtime ownership and request blocking

on:
  push:
    branches: [research/webkit-runtime-url]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      WEBKIT_REVISION: 26695efdefc6076049ec50713a2c4e54b90b4d47
    steps:
      - name: Check out the owned loopback fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify the Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          df -h "$RUNNER_TEMP"
          printf 'kernel void probe() {}\n' > "$RUNNER_TEMP/compile-probe.metal"
          if ! xcrun --sdk macosx metal -c "$RUNNER_TEMP/compile-probe.metal" -o "$RUNNER_TEMP/compile-probe.air"; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun --sdk macosx metal -c "$RUNNER_TEMP/compile-probe.metal" -o "$RUNNER_TEMP/compile-probe.air"
          fi
          df -h "$RUNNER_TEMP"

      - name: Verify JavaScriptCore callable ownership
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang++ -fobjc-arc -std=c++20 -Wall -Wextra -Werror -framework Foundation -framework JavaScriptCore \
            diagnostics/webkit-runtime-ownership-check.mm -o "$RUNNER_TEMP/owned-runtime-check"
          "$RUNNER_TEMP/owned-runtime-check"

      - name: Check out pinned upstream WebKit
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/WebKit"
          git -C "$RUNNER_TEMP/WebKit" remote add origin https://github.com/WebKit/WebKit.git
          git -C "$RUNNER_TEMP/WebKit" fetch --depth=1 origin "$WEBKIT_REVISION"
          git -C "$RUNNER_TEMP/WebKit" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/WebKit" rev-parse HEAD)" = "$WEBKIT_REVISION"
          df -h "$RUNNER_TEMP"

      - name: Compile the macOS engine
        working-directory: ${{ runner.temp }}/WebKit
        shell: bash
        timeout-minutes: 351
        run: |
          set -euo pipefail
          for name in webkit-before-send-cancellation webkit-runtime-owner; do
            patch="$GITHUB_WORKSPACE/diagnostics/$name.patch"
            git apply --check "$patch"
            git apply "$patch"
          done
          git diff --check
          # Keep the working O1 configuration. The probe needs neither IDE indices nor debug symbols.
          Tools/Scripts/set-webkit-configuration --release --force-optimization-level=O1 --lto-mode=none
          log="$RUNNER_TEMP/webkit-probe-build.log"
          trap 'status=$?; if [[ "$status" != 0 && -f "$log" ]]; then tail -n 180 "$log"; fi' EXIT
          Tools/Scripts/build-webkit --release --lto-mode=none --only='Everything up to WebKit' \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO COMPILER_INDEX_STORE_ENABLE=NO 2>&1 |
            tee "$log" |
            awk '/^The following build commands failed/ { failureSummary = 32 }
              NR <= 80 || NR % 4000 == 0 || failureSummary > 0 ||
              /(^|[[:space:]])(fatal error|error|warning|Error):|BUILD (SUCCEEDED|FAILED)|No space left/ {
                print substr($0, 1, 700)
                fflush()
              }
              failureSummary > 0 { failureSummary-- }'
          framework=WebKitBuild/Release/WebKit.framework/WebKit
          test -s "$framework"
          file "$framework"
          xcrun lipo -archs "$framework"
          df -h "$RUNNER_TEMP"

      - name: Preserve compiler diagnostics if the build fails
        if: failure()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webkit-probe-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/webkit-probe-build.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Verify runtime ownership and before-send cancellation in the built framework
        shell: bash
        run: |
          set -euo pipefail
          product="$RUNNER_TEMP/WebKit/WebKitBuild/Release"
          scratch=$(mktemp -d "$RUNNER_TEMP/alcove-webkit-probe.XXXXXX")
          server=''
          cleanup() {
            if [[ -n "$server" ]]; then kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true; fi
            rm -rf "$scratch"
          }
          trap cleanup EXIT
          xcrun swiftc -parse-as-library diagnostics/webkit-extension-probe.swift -o "$scratch/probe"
          python3 diagnostics/webkit-probe-server.py "$scratch/port" > "$scratch/requests.log" 2>&1 &
          server=$!
          for attempt in {1..100}; do
            [[ ! -s "$scratch/port" ]] || break
            kill -0 "$server"
            sleep 0.1
          done
          test -s "$scratch/port"
          status=0
          ALCOVE_EXPECT_WEBKIT_ROOT="$product" DYLD_FRAMEWORK_PATH="$product" __XPC_DYLD_FRAMEWORK_PATH="$product" \
            "$scratch/probe" "http://127.0.0.1:$(cat "$scratch/port")/" --require-runtime-url --require-blocking || status=$?
          cat "$scratch/requests.log"
          exit "$status"
