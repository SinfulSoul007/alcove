name: Release unsigned preview

on:
  push:
    tags: ['v*-preview.*']

permissions:
  contents: read

concurrency:
  group: release-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    outputs:
      commit: ${{ steps.release-metadata.outputs.commit }}
      signed-updates: ${{ steps.release-metadata.outputs.signed-updates }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a matching preview tag and bundle version
        id: release-metadata
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$commit"
          python3 - <<'PY'
          import base64, os, plistlib, re
          tag = os.environ['RELEASE_TAG']
          number = r'(?:0|[1-9][0-9]*)'
          match = re.fullmatch(r'v(' + number + r'\.' + number + r'\.' + number + r')-preview\.' + number, tag)
          if not match:
              raise SystemExit('Expected vMAJOR.MINOR.PATCH-preview.NUMBER with no leading zeroes')
          with open('scripts/Info.plist', 'rb') as source:
              info = plistlib.load(source)
          if info.get('CFBundleShortVersionString') != match[1] or info.get('AlcoveReleaseTag') != tag:
              raise SystemExit('Tag, CFBundleShortVersionString and AlcoveReleaseTag must match before release')
          signing_key = info.get('AlcoveUpdateSigningPublicKey')
          if signing_key is not None:
              try:
                  decoded = base64.b64decode(signing_key, validate=True)
              except (ValueError, TypeError):
                  decoded = b''
              if len(decoded) != 32 or base64.b64encode(decoded).decode('ascii') != signing_key:
                  raise SystemExit('The pinned update public key must be 32 bytes encoded as base64')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as outputs:
              outputs.write('signed-updates=' + ('true' if signing_key is not None else 'false') + '\n')
          print('Validated preview tag and bundle version:', tag)
          PY
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Retrieve the exact tested CI package when available
        id: tested-package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' scripts/Info.plist)
          commit=$(git rev-parse HEAD)
          result=0
          python3 scripts/release_package.py "$GITHUB_REPOSITORY" "$commit" "$version" dist || result=$?
          case "$result" in
            0) printf 'reused=true\n' >> "$GITHUB_OUTPUT" ;;
            3) printf 'reused=false\n' >> "$GITHUB_OUTPUT" ;;
            *) exit "$result" ;;
          esac
      - name: Test and package the universal app
        if: steps.tested-package.outputs.reused != 'true'
        run: ./scripts/package.sh
      - name: Verify checksums, ZIP, universal binaries and mounted DMG
        run: ./scripts/verify-preview-package.sh
      - name: Pass only verified artifacts to publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-preview
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Alcove-*-universal-unsigned-preview.zip
            dist/Alcove-*-universal-unsigned-preview.dmg
            dist/SHA256SUMS.txt

  sign:
    needs: package
    if: needs.package.outputs.signed-updates == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    environment: alcove-release-signing
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ needs.package.outputs.commit }}
    steps:
      - name: Check out the verified release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.package.outputs.commit }}
          persist-credentials: false
      - name: Retrieve verified installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-preview
          path: dist
      - name: Sign the manifest for the checked installer bytes
        env:
          ALCOVE_UPDATE_SIGNING_KEY: ${{ secrets.ALCOVE_UPDATE_SIGNING_KEY }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          ./scripts/sign-preview-update.sh "$RELEASE_TAG" "$RELEASE_COMMIT" dist signed-update
      - name: Pass only the manifest and signature to publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-update-metadata
          if-no-files-found: error
          retention-days: 7
          path: |
            signed-update/Alcove-update-manifest-v1.json
            signed-update/Alcove-update-manifest-v1.sig

  publish:
    needs: [package, sign]
    if: >-
      ${{ !cancelled() && needs.package.result == 'success' &&
          ((needs.package.outputs.signed-updates == 'true' && needs.sign.result == 'success') ||
           (needs.package.outputs.signed-updates == 'false' && needs.sign.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      SIGNED_UPDATES: ${{ needs.package.outputs.signed-updates }}
    steps:
      - name: Retrieve verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-preview
          path: dist
      - name: Retrieve the signed update manifest
        if: env.SIGNED_UPDATES == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-update-metadata
          path: signed-update
      - name: Publish a GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          release_files=(dist/Alcove-*-universal-unsigned-preview.zip dist/Alcove-*-universal-unsigned-preview.dmg dist/SHA256SUMS.txt)
          case "$SIGNED_UPDATES" in
            true)
              test -s signed-update/Alcove-update-manifest-v1.json
              test "$(wc -c < signed-update/Alcove-update-manifest-v1.sig)" -eq 64
              release_files+=(signed-update/Alcove-update-manifest-v1.json signed-update/Alcove-update-manifest-v1.sig)
              ;;
            false) ;;
            *) exit 1 ;;
          esac
          cat > release-notes.txt <<'NOTE'
          Universal macOS 14+ preview for Apple Silicon and Intel.

          Download the DMG, drag Alcove.app to Applications, and review these release notes before opening it. The ZIP contains the same app as an alternative.

          This preview is ad hoc signed. It is NOT Developer ID signed or notarized by Apple. macOS may block it. Keep system security enabled. If blocked, build from source or wait for a notarized release. Early builds may contain bugs and unfinished features.

          Command-N opens another normal window. Window position, selected tabs, sidebar width and collapsed state restore after Quit. Same-profile tab, Split View and Peek transfers keep the live page. Command-W closes the last local tab and its window while keeping pages presented in other windows.

          File uploads, device permissions and extension actions stay tied to their original page and window. A moved tab can open a fresh request from its new window.

          Pinned folders can contain subfolders. Create one from a folder’s menu, or move a folder by dropping it onto its destination. Removing a folder keeps its tabs and subfolders. Pinned and Favorites receive more room when Today has few or no tabs.

          Double-click a sidebar tab name to edit it. Return saves the name and Escape cancels. Tab and Favorites menus also offer Rename Tab and Restore Tab Name.

          Use Duplicate Tab from a tab menu, the File menu or command search. The copy opens in Today and carries the live tab’s back and forward history. If only the saved address is available, the copy opens that address.

          When a pinned tab or Favorite navigates away from its saved address, click the return arrow to go back. Command-click keeps the current live page in Today with its draft and history. The Pinned URL menu can edit the address or save the current page without reloading it.

          In Alcove → Check for Updates, choose Verify Download to check a downloaded installer. The chooser starts in Downloads. The update panel retains the verification controls and release notes link at short window heights.

          Click Pinned to collapse or expand that Space’s saved tabs. You can still drop tabs onto the collapsed heading. Each Space remembers this setting. Use Customize to adjust theme intensity and grain. A two-finger horizontal swipe over the sidebar switches Spaces.

          Hold Control and press Tab to browse up to five recent tabs in the active window and profile. Release Control to switch, press Escape to cancel, or press Control-W to close the highlighted tab.

          Open Alcove → Extensions → Browse Chrome Web Store to find extensions. Alcove’s Review Extension button opens publisher, compatibility and permission details for the selected profile. Compatible extensions can open regular and compact popup windows, including background windows.

          Use Update → Check for Store Update on an installed Chrome Web Store extension. Newer versions open a review. Installed extensions retain their enabled or disabled state, and saved permission exclusions carry forward.

          The first launch opens with a short handwritten Alcove greeting. You can skip it, replay it from the app menu, or use Reduce Motion to go directly to setup.

          Split View can show up to four pages side by side or stacked. Drag a tab onto a row edge or the edge of a page in the same Space. Split groups and their divider proportions restore with normal windows after Quit.

          The native extension manager has limited tested compatibility with uBlock Origin Lite. Full uBlock Origin support is still in development. Native extension APIs need macOS 15.4+. Private request-blocking extensions need a fixed system WebKit (624.1.16 or later).

          Alcove 0.15 keeps encrypted metadata format 8. Existing saved tabs, nested folders and window layouts carry forward. Quit Alcove and keep a backup before replacing its app. Changed unsigned builds can trigger a macOS Keychain approval prompt.

          SHA256SUMS.txt contains checksums for both installers. Checksums detect changed bytes; they do not establish developer identity.
          NOTE
          # Existing releases are never silently overwritten, including on workflow re-runs.
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false \
            --title "Alcove $RELEASE_TAG — Unsigned Preview" \
            --notes-file release-notes.txt --generate-notes \
            "${release_files[@]}"
