name: Release unsigned preview

on:
  push:
    tags: ['v*-preview.*']

permissions:
  contents: read

concurrency:
  group: release-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    outputs:
      commit: ${{ steps.release-metadata.outputs.commit }}
      signed-updates: ${{ steps.release-metadata.outputs.signed-updates }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a matching preview tag and bundle version
        id: release-metadata
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$commit"
          python3 - <<'PY'
          import base64, os, plistlib, re
          tag = os.environ['RELEASE_TAG']
          number = r'(?:0|[1-9][0-9]*)'
          match = re.fullmatch(r'v(' + number + r'\.' + number + r'\.' + number + r')-preview\.' + number, tag)
          if not match:
              raise SystemExit('Expected vMAJOR.MINOR.PATCH-preview.NUMBER with no leading zeroes')
          with open('scripts/Info.plist', 'rb') as source:
              info = plistlib.load(source)
          if info.get('CFBundleShortVersionString') != match[1] or info.get('AlcoveReleaseTag') != tag:
              raise SystemExit('Tag, CFBundleShortVersionString and AlcoveReleaseTag must match before release')
          signing_key = info.get('AlcoveUpdateSigningPublicKey')
          if signing_key is not None:
              try:
                  decoded = base64.b64decode(signing_key, validate=True)
              except (ValueError, TypeError):
                  decoded = b''
              if len(decoded) != 32 or base64.b64encode(decoded).decode('ascii') != signing_key:
                  raise SystemExit('The pinned update public key must be 32 bytes encoded as base64')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as outputs:
              outputs.write('signed-updates=' + ('true' if signing_key is not None else 'false') + '\n')
          print('Validated preview tag and bundle version:', tag)
          PY
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Retrieve the exact tested CI package when available
        id: tested-package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' scripts/Info.plist)
          commit=$(git rev-parse HEAD)
          result=0
          python3 scripts/release_package.py "$GITHUB_REPOSITORY" "$commit" "$version" dist || result=$?
          case "$result" in
            0) printf 'reused=true\n' >> "$GITHUB_OUTPUT" ;;
            3) printf 'reused=false\n' >> "$GITHUB_OUTPUT" ;;
            *) exit "$result" ;;
          esac
      - name: Test and package the universal app
        if: steps.tested-package.outputs.reused != 'true'
        run: ./scripts/package.sh
      - name: Verify checksums, ZIP, universal binaries and mounted DMG
        run: ./scripts/verify-preview-package.sh
      - name: Pass only verified artifacts to publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-preview
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Alcove-*-universal-unsigned-preview.zip
            dist/Alcove-*-universal-unsigned-preview.dmg
            dist/SHA256SUMS.txt

  sign:
    needs: package
    if: needs.package.outputs.signed-updates == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    environment: alcove-release-signing
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ needs.package.outputs.commit }}
    steps:
      - name: Check out the verified release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.package.outputs.commit }}
          persist-credentials: false
      - name: Retrieve verified installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-preview
          path: dist
      - name: Sign the manifest for the checked installer bytes
        env:
          ALCOVE_UPDATE_SIGNING_KEY: ${{ secrets.ALCOVE_UPDATE_SIGNING_KEY }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          ./scripts/sign-preview-update.sh "$RELEASE_TAG" "$RELEASE_COMMIT" dist signed-update
      - name: Pass only the manifest and signature to publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-update-metadata
          if-no-files-found: error
          retention-days: 7
          path: |
            signed-update/Alcove-update-manifest-v1.json
            signed-update/Alcove-update-manifest-v1.sig

  publish:
    needs: [package, sign]
    if: >-
      ${{ !cancelled() && needs.package.result == 'success' &&
          ((needs.package.outputs.signed-updates == 'true' && needs.sign.result == 'success') ||
           (needs.package.outputs.signed-updates == 'false' && needs.sign.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      SIGNED_UPDATES: ${{ needs.package.outputs.signed-updates }}
    steps:
      - name: Retrieve verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-preview
          path: dist
      - name: Retrieve the signed update manifest
        if: env.SIGNED_UPDATES == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-update-metadata
          path: signed-update
      - name: Publish a GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          release_files=(dist/Alcove-*-universal-unsigned-preview.zip dist/Alcove-*-universal-unsigned-preview.dmg dist/SHA256SUMS.txt)
          case "$SIGNED_UPDATES" in
            true)
              test -s signed-update/Alcove-update-manifest-v1.json
              test "$(wc -c < signed-update/Alcove-update-manifest-v1.sig)" -eq 64
              release_files+=(signed-update/Alcove-update-manifest-v1.json signed-update/Alcove-update-manifest-v1.sig)
              ;;
            false) ;;
            *) exit 1 ;;
          esac
          cat > release-notes.txt <<'NOTE'
          Universal macOS 14+ preview for Apple Silicon and Intel.

          Alcove now checks navigation destinations against a bundled local phishing-domain list. A warning holds the original request and offers Go Back or a separate explicit continuation. Checks stay on your Mac; browsing addresses are not sent to the list provider. The warning identifies the actual hostname, provider and list date. Settings reports loading, unavailable and stale data honestly.

          Warnings follow the actual page in normal tabs, Split View, Peek, Quick Browse and extension-created website windows. Cancel keeps the current document and form. Continue preserves the original request, including form submissions and navigation downloads. Closing or transferring a page revokes its old warning controls. Closing a blocked tab remembers the committed page behind the warning for Reopen Closed Tab.

          Sidebar resizing now keeps the mouse interaction free of a lingering keyboard focus ring. Using the keyboard restores its visible focus indicator. All welcome-theme choices fit the minimum setup window height.

          Future update offers are checked against Alcove's publisher signature. Download and install updates manually; Alcove never silently replaces or executes a downloaded app.

          Download the DMG and drag Alcove.app to Applications. The ZIP contains the same app as an alternative. This preview is ad hoc signed, without Apple Developer ID signing or notarization. macOS may block it. Keep system security enabled; build from source or wait for a notarized release if needed.

          The local list is an additional layer with limited coverage. An address absent from it is not a safety guarantee. It does not inspect downloaded files, page contents or arbitrary subresource requests. List updates currently arrive with app releases; data older than 30 days is marked stale.

          This release uses system WebKit. Full uBlock Origin remains unsupported in this preview, and Chrome extension compatibility is incomplete. The separate experimental engine has not passed full-uBlock qualification and is not included. Extensions require macOS 15.4 or later and their supported APIs and permissions must be reviewed before installation.

          Browser metadata is encrypted locally; WebKit's cookies, caches and website data are managed separately. Private browsing does not make you anonymous. Independent security review, broader site compatibility, accessibility, Intel hardware and minimum-OS testing remain ongoing. This is a preview with unfinished features.

          NOTE
          # Existing releases are never silently overwritten, including on workflow re-runs.
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false \
            --title "Alcove $RELEASE_TAG — Unsigned Preview" \
            --notes-file release-notes.txt --generate-notes \
            "${release_files[@]}"
