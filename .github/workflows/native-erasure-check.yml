name: Native extension toolchain comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    name: ${{ matrix.toolchain.name }}
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - name: Xcode 16.4
            developer: /Applications/Xcode_16.4.app/Contents/Developer
          - name: Xcode 26.3
            developer: /Applications/Xcode_26.3.app/Contents/Developer
    env:
      DEVELOPER_DIR: ${{ matrix.toolchain.developer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Identify build tools and system WebKit
        run: |
          sw_vers
          xcrun --show-sdk-path
          xcrun swiftc --version
          xcrun swift -e 'import Foundation; import WebKit; print("WebKit build:", Bundle(for: WKWebView.self).infoDictionary?["CFBundleVersion"] ?? "unknown")'
      - name: Verify identical owned native erasure and network controls
        run: caffeinate -is scripts/build.sh extension-erasure-test
