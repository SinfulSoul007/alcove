name: Actual installed cross-build Keychain and private startup qualification
on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Exact successful Alcove CI artifact ID
        required: true
        type: string
      source:
        description: Exact tested artifact source commit
        required: true
        type: string
      version:
        description: Declared installer version
        required: true
        type: string
      digest:
        description: GitHub artifact SHA256 without prefix
        required: true
        type: string
      normal_motion:
        description: Enable normal animations in this disposable runner only
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out owned test helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify actual runtime architecture and select SDK
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p .build/fullscreen/installed
          test "$(uname -m)" = "$EXPECTED_ARCH"
          translated=$(sysctl -n sysctl.proc_translated 2>/dev/null || true)
          test "$translated" != 1
          test -d /Applications/Xcode_26.5.app/Contents/Developer
          echo DEVELOPER_DIR=/Applications/Xcode_26.5.app/Contents/Developer >> "$GITHUB_ENV"
          { uname -m; sw_vers; sysctl -n hw.cputype; sysctl -n machdep.cpu.brand_string 2>/dev/null || true; } > .build/fullscreen/installed/runtime.log
      - name: Configure normal motion in the disposable runner
        if: ${{ inputs.normal_motion }}
        run: |
          set -euo pipefail
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults read com.apple.universalaccess reduceMotion
      - name: Build unchanged candidate application sources
        env:
          CANDIDATE_SOURCE: fb3b90b2fc6be86fb4366979204a48e7eb9362e3
        run: |
          set -euo pipefail
          git diff --exit-code "$CANDIDATE_SOURCE" HEAD -- Sources Resources scripts/Info.plist scripts/build.sh
          BROWSER_OUTPUT=.build/update-candidate/Alcove.app ./scripts/build.sh
          codesign --verify --deep --strict .build/update-candidate/Alcove.app
          lipo .build/update-candidate/Alcove.app/Contents/MacOS/Alcove -verify_arch "$(uname -m)"
          python3 scripts/record-update-candidate.py
      - name: Authenticate exact CI package and copy application
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_ARTIFACT: ${{ inputs.artifact }}
          TEST_SOURCE: ${{ inputs.source }}
          TEST_VERSION: ${{ inputs.version }}
          TEST_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          python3 scripts/stage-installed-artifact.py --artifact "$TEST_ARTIFACT" --source "$TEST_SOURCE" --version "$TEST_VERSION" --digest "$TEST_DIGEST"
      - name: Test actual changed app recovery, private availability and original data preservation
        env:
          ALCOVE_REQUIRE_OPENING_ANIMATION: ${{ inputs.normal_motion }}
        run: |
          set -euo pipefail
          xcrun swiftc -sdk "$(xcrun --show-sdk-path)" -target "$(uname -m)-apple-macosx14.0" -module-cache-path .build/installed-cache -parse-as-library -warnings-as-errors scripts/InstalledAlcoveUpdateChecks.swift -o .build/installed-smoke
          caffeinate -dis .build/installed-smoke 2>&1 | tee .build/fullscreen/installed/native.log
      - name: Preserve owned observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-alcove-${{ matrix.arch }}-${{ github.run_id }}
          retention-days: 14
          path: .build/fullscreen/installed/
