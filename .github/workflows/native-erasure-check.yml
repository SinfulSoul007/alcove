name: Owned browser public accessibility qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select qualification SDK
        run: |
          test -d /Applications/Xcode_26.5.app/Contents/Developer
          echo DEVELOPER_DIR=/Applications/Xcode_26.5.app/Contents/Developer >> "$GITHUB_ENV"
      - name: Verify public AX controls in the actual owned browser
        env:
          ALCOVE_AX_EVIDENCE_DIR: ${{ github.workspace }}/.build/fullscreen
        run: |
          set -o pipefail
          mkdir -p .build/fullscreen
          caffeinate -dis python3 scripts/drawing/run-native.py --review 2>&1 | tee .build/fullscreen/native.log
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-browser-ax-${{ github.run_id }}
          retention-days: 14
          path: |
            .build/fullscreen/native.log
            .build/fullscreen/drawing-inputs.json
            .build/fullscreen/owned-state.json
