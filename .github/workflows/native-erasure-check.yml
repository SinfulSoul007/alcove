name: Owned website fullscreen qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select the Apple SDK used for native qualification
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.5.app/Contents/Developer
          export DEVELOPER_DIR=/Applications/Xcode_26.5.app/Contents/Developer
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.5
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Verify genuine website fullscreen and view restoration
        run: |
          set -o pipefail
          mkdir -p .build/fullscreen
          caffeinate -is python3 scripts/fullscreen/run-native.py 2>&1 | tee .build/fullscreen/native.log
      - name: Preserve the native command result before regression groups
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fullscreen-native-${{ github.run_id }}
          path: .build/fullscreen/native.log
          if-no-files-found: warn
          retention-days: 14
      - name: Verify existing Reader lifecycle on the changed website hosts
        if: always()
        run: |
          set -o pipefail
          mkdir -p .build/fullscreen
          caffeinate -is scripts/build.sh reader-mode-test 2>&1 | tee .build/fullscreen/reader.log
      - name: Verify existing chrome geometry and sidebar controls
        if: always()
        run: |
          set -o pipefail
          mkdir -p .build/fullscreen
          caffeinate -is scripts/build.sh chrome-test 2>&1 | tee .build/fullscreen/chrome.log
      - name: Preserve the bounded native result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-fullscreen-${{ github.run_id }}
          path: .build/fullscreen/*.log
          if-no-files-found: warn
          retention-days: 14
