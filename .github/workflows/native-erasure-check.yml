name: Verify separate private content-controller initialization
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stage: [none, immediate, document]
    env:
      ALCOVE_PRIVATE_PRIME: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify original normal control and newly approved private clients
        run: caffeinate -is scripts/build.sh extension-erasure-test
