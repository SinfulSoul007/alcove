name: Owned accessibility environment qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select qualification SDK
        run: |
          test -d /Applications/Xcode_26.5.app/Contents/Developer
          echo DEVELOPER_DIR=/Applications/Xcode_26.5.app/Contents/Developer >> "$GITHUB_ENV"
      - name: Probe preexisting accessibility access using an owned child
        run: |
          set -o pipefail
          mkdir -p .build/fullscreen
          xcrun swiftc -sdk "$(xcrun --show-sdk-path)" -target arm64-apple-macosx14.0 -module-cache-path .build/ax-cache -parse-as-library -warnings-as-errors scripts/OwnedAXEnvironmentProbe.swift -o .build/fullscreen/owned-ax-probe
          caffeinate -dis .build/fullscreen/owned-ax-probe 2>&1 | tee .build/fullscreen/native.log
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-ax-environment-${{ github.run_id }}
          retention-days: 14
          path: |
            .build/fullscreen/native.log
