name: Native extension initialization-order comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    name: ${{ matrix.stage }}
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stage: [none, beforeLoad, beforeRules]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ALCOVE_BOOTSTRAP_STAGE: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify original request blocking and owned erasure controls
        run: caffeinate -is scripts/build.sh extension-erasure-test
