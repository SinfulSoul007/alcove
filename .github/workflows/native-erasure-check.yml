name: Internal owned stable signing continuity diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select pinned SDK
        run: echo DEVELOPER_DIR=/Applications/Xcode_26.5.app/Contents/Developer >> "$GITHUB_ENV"
      - name: Test own temporary signing identity without trust changes
        run: |
          set -euo pipefail
          mkdir -p .build/fullscreen/stable-signing
          python3 scripts/owned-stable-signing-probe.py 2>&1 | tee .build/fullscreen/stable-signing/diagnostic.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owned-stable-signing-${{ github.run_id }}
          retention-days: 14
          path: .build/fullscreen/stable-signing/
